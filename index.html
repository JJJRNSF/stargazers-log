<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Stargazers log</h1>
        <p class="description">A log of the repositories I've starred.</p>
      </header>

      <section aria-labelledby="starred-heading">
        <h2 id="starred-heading" class="sr-only">Starred repositories</h2>
        <div id="status-message" class="status-message" role="status" aria-live="polite" aria-atomic="true">
          Loading starred repositories…
        </div>
        <ul id="starred-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
